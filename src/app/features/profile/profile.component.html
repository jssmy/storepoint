<div class="profile">

  <header class="profile__page-header">
    <h1 class="profile__title">Configuración de perfil</h1>
  </header>

  <!-- Avatar -->
  <div class="profile__card">
    <div class="profile__avatar-wrap">
      <button class="profile__avatar-btn" type="button" (click)="fileInput.click()" aria-label="Cambiar foto de perfil">
        @if (avatarUrl()) {
          <img class="profile__avatar-img" [src]="avatarUrl()" alt="Foto de perfil">
        } @else {
          <span class="profile__avatar-initial" aria-hidden="true">{{ userInitial() }}</span>
        }
        <span class="profile__avatar-overlay" aria-hidden="true">
          <i stp-icon name="camera" [autofill]="false" style="font-size: 1.375rem"></i>
        </span>
      </button>
      <input #fileInput type="file" accept="image/*" style="display:none" (change)="onAvatarChange($event)">
      <span class="profile__avatar-name">{{ name() }}</span>
    </div>
  </div>

  <!-- Información personal -->
  <div class="profile__card">
    <h2 class="profile__section-title">Información personal</h2>
    <div class="profile__fields">
      <stp-input
        label="Correo electrónico"
        type="email"
        [(value)]="email"
        autocomplete="email"
      />
      <stp-input
        label="Número de teléfono"
        type="tel"
        [(value)]="phone"
        autocomplete="tel"
      />
    </div>
    <div class="profile__actions">
      <stp-button variant="primary" size="md" type="button" (click)="saveProfile()">
        Guardar cambios
      </stp-button>
    </div>
  </div>

  <!-- Cambiar contraseña -->
  <div class="profile__card">
    <h2 class="profile__section-title">Cambiar contraseña</h2>
    <div class="profile__fields">
      <stp-input
        label="Contraseña actual"
        type="password"
        [(value)]="currentPassword"
        autocomplete="current-password"
      />
      <stp-input
        label="Nueva contraseña"
        type="password"
        [(value)]="newPassword"
        autocomplete="new-password"
      />
      <stp-input
        label="Confirmar nueva contraseña"
        type="password"
        [(value)]="confirmPassword"
        autocomplete="new-password"
      />
    </div>
    <div class="profile__actions">
      <stp-button variant="primary" size="md" type="button" (click)="savePassword()">
        Actualizar contraseña
      </stp-button>
    </div>
  </div>

</div>
