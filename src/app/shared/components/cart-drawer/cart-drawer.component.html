<div class="cart-overlay" (click)="close()" aria-modal="true" role="dialog" aria-label="Carrito de venta">
    <div class="cart-drawer" (click)="$event.stopPropagation()">

        <div class="cart-drawer__handle" aria-hidden="true"></div>

        @if (step() === 1) {
        <stp-cart-step
            [items]="items()"
            [swipeOptions]="swipeOptions"
            (quantityChange)="updateQty($event.productId, $event.quantity)"
            (remove)="removeItem($event)"
            (close)="close()"
            (clear)="clear()"
            (checkout)="goToPayment()" />
        } @else {
        <stp-payment-step
            [total]="total()"
            (back)="goBack()"
            (confirm)="confirmPayment($event)" />
        }

    </div>
</div>
