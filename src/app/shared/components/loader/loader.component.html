@if (visible()) {
  <div
    class="loader-overlay liquid-glass-overlay"
    role="status"
    aria-live="polite"
    aria-label="Cargando"
  >
    <div class="loader-content">

      <!-- Spinning ring + logo -->
      <div class="loader-ring-wrapper" aria-hidden="true">

        <!-- SVG spinning arc -->
        <svg
          class="loader-ring"
          viewBox="0 0 100 100"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- Track -->
          <circle
            class="loader-ring__track"
            cx="50" cy="50" r="44"
            stroke-width="4"
          />
          <!-- Animated arc -->
          <circle
            class="loader-ring__arc"
            cx="50" cy="50" r="44"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>

        <!-- Logo circle (liquid glass) -->
        <div class="loader-logo liquid-glass">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="34" height="34"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <line x1="3" x2="21" y1="6" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>

      </div>

      <span class="sr-only">Cargando, por favor espera…</span>

    </div>
  </div>
}
