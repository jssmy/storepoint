<div [ngClass]="classes()" role="group" [attr.aria-label]="'Cantidad'">

    <button
        class="stp-input-numeric__btn"
        type="button"
        aria-label="Disminuir"
        [disabled]="!canDecrement() || isDisabled()"
        (click)="decrement()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M5 12h14" />
        </svg>
    </button>

    <input
        class="stp-input-numeric__input"
        type="number"
        [min]="min()"
        [attr.max]="max()"
        [value]="effectiveValue()"
        [disabled]="isDisabled()"
        (change)="onInput($any($event.target).value)"
        aria-label="Valor" />

    <button
        class="stp-input-numeric__btn"
        type="button"
        aria-label="Aumentar"
        [disabled]="!canIncrement() || isDisabled()"
        (click)="increment()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
        </svg>
    </button>

</div>
