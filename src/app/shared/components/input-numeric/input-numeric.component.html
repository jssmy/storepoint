<div [ngClass]="classes()" role="group" [attr.aria-label]="'Cantidad'">

    <button
        class="stp-input-numeric__btn"
        type="button"
        aria-label="Disminuir"
        [disabled]="!canDecrement() || isDisabled()"
        (click)="decrement()">
        <i class="ph ph-minus" style="font-size: 0.875rem" aria-hidden="true"></i>
    </button>

    <input
        class="stp-input-numeric__input"
        type="number"
        [min]="min()"
        [attr.max]="max()"
        [value]="effectiveValue()"
        [disabled]="isDisabled()"
        (change)="onInput($any($event.target).value)"
        aria-label="Valor" />

    <button
        class="stp-input-numeric__btn"
        type="button"
        aria-label="Aumentar"
        [disabled]="!canIncrement() || isDisabled()"
        (click)="increment()">
        <i class="ph ph-plus" style="font-size: 0.875rem" aria-hidden="true"></i>
    </button>

</div>
