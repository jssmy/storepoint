<div class="swipe-container">
    <div class="actions">
        @for (item of options; track $index) {
            <button [class]="item.stpClass">{{item.label}}</button>
        }
    </div>

    <div class="content" (pointerdown)="onStart($event)" (pointermove)="onMove($event)" (pointerup)="onEnd()"
        (pointerleave)="onEnd()" [style.transform]="'translateX(' + offset + 'px)'" [class.animate]="animate">
        <ng-content></ng-content>
    </div>
</div>
